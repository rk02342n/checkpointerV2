# fly.toml app configuration file generated for checkpointerv2 on 2026-01-17T18:06:36-05:00
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'checkpointerv2'
primary_region = 'ewr'

# Let the worker's graceful drain (25s) finish before SIGKILL.
kill_timeout = 30

[build]

[processes]
  app = 'bun run start'
  # Background job worker (server/worker.ts): no public services, so Fly never
  # auto-stops it — it stays up to poll the queue and run the cron schedule.
  worker = 'bun run start:worker'

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0
  processes = ['app']

[[vm]]
  memory = '1gb'
  cpu_kind = 'shared'
  cpus = 1
  processes = ['app']

[[vm]]
  # Sized for the weekly IGDB sync's in-memory lookup maps.
  memory = '512mb'
  cpu_kind = 'shared'
  cpus = 1
  processes = ['worker']
